name: Gen Keystore

# 一次性工具：在 CI 里生成签名用的 keystore，产物仅作为 artifact 保存（artifact 需要登录才可下载）。
# 生成后由维护者下载并写入仓库 Secrets，随后可删除本文件。
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and package keystore
        run: |
          set -euo pipefail
          PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
          ALIAS="mei"
          keytool -genkeypair -v \
            -keystore mei-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Mei Personal Fork, OU=Personal, O=Mei, L=Local, ST=Local, C=CN"
          base64 -w0 mei-release.jks > keystore.b64
          printf '%s' "$PASSWORD" > key-store-password.txt
          printf '%s' "$ALIAS" > key-alias.txt
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: mei-keystore
          path: |
            keystore.b64
            key-store-password.txt
            key-alias.txt
          retention-days: 1
